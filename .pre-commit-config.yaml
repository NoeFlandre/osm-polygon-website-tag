minimum_pre_commit_version: "4.5.0"
default_install_hook_types: [pre-commit, pre-push]

# Tier 1 runs on the commit, Tier 2 on the push. Neither runs the whole suite:
# the pull-request gate does that on every commit, so paying for it again
# locally buys waiting, not safety. Both tiers stay strict about what they do
# cover -- nothing here is allowed to pass a failure through.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run --locked ty check src tests scripts
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: focused-tests
        name: focused tests
        entry: just focused
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: bounded-tests
        name: bounded tests
        entry: just qa-push
        language: system
        pass_filenames: false
        stages: [pre-push]
