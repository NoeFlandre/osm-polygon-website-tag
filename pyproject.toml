[project]
name = "osm-polygon-website-tag"
version = "0.1.0"
description = "Analyze OpenStreetMap polygons that carry a website tag."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Noé Flandre" },
]
keywords = ["openstreetmap", "osm", "geospatial", "data-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "duckdb>=1.0.0",
    "h3>=4,<5",
    "huggingface-hub>=1.25.1",
    "matplotlib>=3.8,<4",
    "osmium>=4.3.1",
    "pyarrow>=25.0.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "rich>=14,<15",
    "tqdm>=4.67,<5",
    "trafilatura>=2.1,<3",
    "typer>=0.21,<1",
]

[project.scripts]
osm-polygon-website-tag = "osm_polygon_website_tag.application.cli:main"

[project.urls]
Homepage = "https://github.com/NoeFlandre/osm-polygon-website-tag"
Repository = "https://github.com/NoeFlandre/osm-polygon-website-tag.git"
HuggingFace = "https://huggingface.co/datasets/NoeFlandre/osm-polygon-website-tag"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_polygon_website_tag"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=4.5,<5",
    "ruff>=0.5",
    "ty>=0.0.65",
    "mkdocs-material>=9.6,<10",
    "mutmut>=3,<4",
    "radon>=6,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # use pathlib
    "ERA",  # eradicate commented-out code
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # asserts allowed in tests
    "E501",  # line length handled by formatter; some long dict literals are clearer on one line
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607", "E501", "PTH107", "S108", "B018"]
"src/osm_polygon_website_tag/application/cli.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.mutmut]
source_paths = [
    "src/osm_polygon_website_tag",
]
also_copy = ["src/osm_polygon_website_tag/"]
pytest_add_cli_args = ["-q"]
mutate_only_covered_lines = true
max_stack_depth = 3
