name: Mutation sweep

on:
  # Tier 5. A full sweep is hours of work, so it runs while nobody is waiting
  # and on demand, never in the path of a pull request.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      children:
        description: Mutant test processes per job
        default: "4"

concurrency:
  group: mutation-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Property tests get a large example budget here, where nobody is waiting.
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run the property tests
        run: uv run --locked pytest -q -n auto $(find tests -name 'test_*properties.py')

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mutation_shards: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Resolve nightly mutation shards
        id: resolve
        run: |
          set -euo pipefail
          matrix="$(uv run --locked python scripts/quality/mutation_scope.py --full-sweep-json)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  area:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.mutation_shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Sweep the shard
        id: sweep
        env:
          MUTATION_FILTERS: ${{ matrix.shard.filters }}
          MUTATION_SHARD_NAME: ${{ matrix.shard.name }}
        run: |
          read -r -a filters <<< "$MUTATION_FILTERS"
          status=0
          uv run --locked python scripts/quality/mutation_runner.py run \
            --max-children "${{ inputs.children || '4' }}" \
            "${filters[@]}" || status=$?
          if [ "$status" -eq 86 ]; then
            echo "::error::mutation shard ${MUTATION_SHARD_NAME} matched no mutable functions; check scripts/quality/mutation_scope.py and its package" >&2
          fi
          exit "$status"

      - name: Require all shard mutants to have verdicts
        id: verify-pipeline
        if: matrix.shard.pipeline == true
        env:
          MUTATION_MODULE: ${{ matrix.shard.module }}
          MUTATION_FILTERS: ${{ matrix.shard.filters }}
        run: |
          read -r -a filters <<< "$MUTATION_FILTERS"
          uv run --locked python scripts/quality/mutation_verdicts.py verify \
            --module "$MUTATION_MODULE" --filters "${filters[@]}"

      - name: Collect the shard's unverified mutants
        run: |
          set -euo pipefail
          # A failing results command fails this step. Only grep's "no line
          # matched" status (1) is an empty, valid result.
          uv run --locked mutmut results --all true > "results-${{ matrix.shard.id }}.all.txt"
          grep -E ': (survived|no tests|timeout|suspicious|segfault|check was interrupted by user)$' \
            "results-${{ matrix.shard.id }}.all.txt" > "results-${{ matrix.shard.id }}.txt" || [ "$?" -eq 1 ]
          wc -l < "results-${{ matrix.shard.id }}.txt"

      - name: Upload the shard baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results-${{ matrix.shard.id }}
          path: results-${{ matrix.shard.id }}.txt
          overwrite: true


  merge:
    needs: [plan, area]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Require every mutation shard to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          AREA_RESULT: ${{ needs.area.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "mutation shard plan finished with $PLAN_RESULT" >&2
            exit 1
          fi
          if [[ "$AREA_RESULT" != "success" ]]; then
            echo "mutation shard jobs finished with $AREA_RESULT" >&2
            exit 1
          fi

      - name: Download every shard result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: areas
          pattern: mutation-results-*
          merge-multiple: true

      - name: Require a result artifact from every shard
        env:
          MUTATION_SHARDS_JSON: ${{ needs.plan.outputs.mutation_shards }}
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path

          shards = json.loads(os.environ["MUTATION_SHARDS_JSON"])
          missing = [
              f"areas/results-{shard['id']}.txt"
              for shard in shards
              if not Path(f"areas/results-{shard['id']}.txt").is_file()
          ]
          if missing:
              raise SystemExit("mutation shards produced no result artifact: " + ", ".join(missing))
          PY

      # The recorded baseline is never rewritten upward by the sweep: a new
      # survivor fails this job, and the regenerated file is only an artifact
      # to review and commit deliberately. The diff artifact shows that change
      # against the committed baseline, so a reviewer need not diff by hand.
      - name: Merge the shard results into a candidate baseline
        run: |
          set -euo pipefail
          cat areas/results-*.txt > merged.txt
          uv run --locked python scripts/quality/mutation_baseline.py \
            --results merged.txt --baseline docs/quality/mutation-baseline.txt \
            --output mutation-baseline-candidate.txt --diff mutation-baseline.diff \
            --fail-on-growth
          head -20 mutation-baseline-candidate.txt

      - name: Upload the candidate baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-baseline-candidate
          path: mutation-baseline-candidate.txt
          if-no-files-found: ignore

      - name: Upload the baseline diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-baseline-diff
          path: mutation-baseline.diff
          if-no-files-found: ignore
