name: Mutation sweep

# A full sweep is about fourteen thousand mutants. Run per package area in
# parallel so each job finishes well inside a runner's lifetime, then merge the
# results into the baseline the gate enforces. Manual: pushes run the scoped
# gate in the Quality workflow instead.
on:
  # Tier 5. A full sweep is hours of work, so it runs while nobody is waiting
  # and on demand, never in the path of a pull request.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      children:
        description: Mutant test processes per job
        default: "4"

concurrency:
  group: mutation-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Property tests get a large example budget here, where nobody is waiting.
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run the property tests
        run: uv run --locked pytest -q -n auto $(find tests -name 'test_*properties.py')

  area:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        area:
          - pipeline
          - reporting
          - application
          - publishing
          - domain
          - contracts
          - runtime
          - web
          - storage
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Sweep the area
        run: |
          uv run --locked python scripts/quality/mutation_runner.py run \
            --max-children "${{ inputs.children || '4' }}" \
            "osm_polygon_website_tag.${{ matrix.area }}.*"

      - name: Collect the area's unverified mutants
        run: |
          uv run --locked mutmut results --all true \
            | grep -E ': (survived|no tests|timeout|suspicious|segfault|check was interrupted)$' \
            > "results-${{ matrix.area }}.txt" || true
          wc -l < "results-${{ matrix.area }}.txt"

      - name: Upload the area's baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results-${{ matrix.area }}
          path: results-${{ matrix.area }}.txt

  merge:
    needs: area
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Download every area's baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: areas
          pattern: mutation-results-*
          merge-multiple: true

      - name: Require a result artifact from every area
        run: |
          set -euo pipefail
          areas=(pipeline reporting application publishing domain contracts runtime web storage)
          for area in "${areas[@]}"; do
            artifact="areas/results-${area}.txt"
            if [[ ! -f "$artifact" ]]; then
              echo "mutation area $area produced no result artifact: $artifact" >&2
              exit 1
            fi
          done

      # The recorded baseline is never rewritten upward by the sweep: a new
      # survivor fails this job, and the regenerated file is only an artifact
      # to review and commit deliberately.
      - name: Merge the areas into a candidate baseline
        run: |
          set -euo pipefail
          cat areas/results-*.txt > merged.txt
          uv run --locked python scripts/quality/mutation_baseline.py \
            --results merged.txt --baseline docs/quality/mutation-baseline.txt \
            --output mutation-baseline-candidate.txt --fail-on-growth
          head -20 mutation-baseline-candidate.txt

      - name: Upload the candidate baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-baseline-candidate
          path: mutation-baseline-candidate.txt
          if-no-files-found: ignore
