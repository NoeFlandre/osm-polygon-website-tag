name: Mutation sweep

# A full sweep is about fourteen thousand mutants. Run per package area in
# parallel so each job finishes well inside a runner's lifetime, then merge the
# results into the baseline the gate enforces. Manual: pushes run the scoped
# gate in the Quality workflow instead.
on:
  # Tier 5. A full sweep is hours of work, so it runs while nobody is waiting
  # and on demand, never in the path of a pull request.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      children:
        description: Mutant test processes per job
        default: "4"

concurrency:
  group: mutation-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Property tests get a large example budget here, where nobody is waiting.
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run the property tests
        run: uv run --locked pytest -q -n auto $(find tests -name 'test_*properties.py')

  area:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        area:
          - pipeline
          - reporting
          - application
          - publishing
          - domain
          - contracts
          - runtime
          - web
          - storage
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Fingerprint the mutation environment
        id: mutation-env
        if: matrix.area == 'pipeline'
        run: |
          set -euo pipefail
          fingerprint="$(
            {
              printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$(cat .python-version)"
              uv --version
              uv run --locked python --version
            } | sha256sum | cut -c1-16
          )"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore an interrupted pipeline sweep
        if: matrix.area == 'pipeline'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-checkpoint
          key: mutation-pipeline-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('uv.lock') }}-${{ steps.mutation-env.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mutation-pipeline-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('uv.lock') }}-${{ steps.mutation-env.outputs.fingerprint }}-

      - name: Prepare the pipeline sweep checkpoint
        if: matrix.area == 'pipeline'
        run: uv run --locked python scripts/quality/mutation_checkpoint.py prepare

      - name: Sweep the area
        id: sweep
        # Exit status 86 means the area's filter matched no mutable function, as
        # when an area mapped to a bare __init__.py. That is a mapping fault,
        # so name the area in the failure rather than leave a bare exit code.
        env:
          MUTATION_SOURCE_SCOPE: ${{ matrix.area == 'pipeline' && 'osm_polygon_website_tag.pipeline.*' || '' }}
        run: |
          filters=()
          if [[ "${{ matrix.area }}" != "pipeline" ]]; then
            filters+=("osm_polygon_website_tag.${{ matrix.area }}.*")
          fi
          status=0
          uv run --locked python scripts/quality/mutation_runner.py run \
            --max-children "${{ inputs.children || '4' }}" \
            "${filters[@]}" || status=$?
          if [ "$status" -eq 86 ]; then
            echo "::error::mutation area ${{ matrix.area }} matched no mutable functions; check scripts/quality/mutation_scope.py and its package" >&2
          fi
          exit "$status"

      - name: Require all pipeline mutants to have verdicts
        id: verify-pipeline
        if: matrix.area == 'pipeline'
        run: uv run --locked python scripts/quality/mutation_checkpoint.py verify

      - name: Mark the pipeline sweep checkpoint
        id: mark-checkpoint
        if: always() && matrix.area == 'pipeline'
        run: >-
          uv run --locked python scripts/quality/mutation_checkpoint.py mark
          --outcome "${{ steps.verify-pipeline.outcome }}"

      - name: Collect the area's unverified mutants
        run: |
          set -euo pipefail
          # A failing results command fails this step. Only grep's "no line
          # matched" status (1) is an empty, valid result.
          uv run --locked mutmut results --all true > "results-${{ matrix.area }}.all.txt"
          grep -E ': (survived|no tests|timeout|suspicious|segfault|check was interrupted by user)$' \
            "results-${{ matrix.area }}.all.txt" > "results-${{ matrix.area }}.txt" || [ "$?" -eq 1 ]
          wc -l < "results-${{ matrix.area }}.txt"

      - name: Upload the area's baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-${{ matrix.area }}
          path: results-${{ matrix.area }}.txt

      - name: Save the pipeline sweep checkpoint
        if: >-
          always() && matrix.area == 'pipeline'
          && steps.mark-checkpoint.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-checkpoint
          key: mutation-pipeline-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('uv.lock') }}-${{ steps.mutation-env.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}

  merge:
    needs: area
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      - name: Download every area's baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: areas
          pattern: mutation-results-*
          merge-multiple: true

      - name: Require a result artifact from every area
        run: |
          set -euo pipefail
          areas=(pipeline reporting application publishing domain contracts runtime web storage)
          for area in "${areas[@]}"; do
            artifact="areas/results-${area}.txt"
            if [[ ! -f "$artifact" ]]; then
              echo "mutation area $area produced no result artifact: $artifact" >&2
              exit 1
            fi
          done

      # The recorded baseline is never rewritten upward by the sweep: a new
      # survivor fails this job, and the regenerated file is only an artifact
      # to review and commit deliberately. The diff artifact shows that change
      # against the committed baseline, so a reviewer need not diff by hand.
      - name: Merge the areas into a candidate baseline
        run: |
          set -euo pipefail
          cat areas/results-*.txt > merged.txt
          uv run --locked python scripts/quality/mutation_baseline.py \
            --results merged.txt --baseline docs/quality/mutation-baseline.txt \
            --output mutation-baseline-candidate.txt --diff mutation-baseline.diff \
            --fail-on-growth
          head -20 mutation-baseline-candidate.txt

      - name: Upload the candidate baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-baseline-candidate
          path: mutation-baseline-candidate.txt
          if-no-files-found: ignore

      - name: Upload the baseline diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-baseline-diff
          path: mutation-baseline.diff
          if-no-files-found: ignore
