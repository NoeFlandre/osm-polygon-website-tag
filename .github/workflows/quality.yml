name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The mutation gate diffs against a base ref to find changed modules.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.50.0"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Resolve the mutation base
        id: mutation-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            printf 'ref=origin/%s\n' "${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=HEAD^\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Run quality gates
        run: just qa-ci "${{ steps.mutation-base.outputs.ref }}"
