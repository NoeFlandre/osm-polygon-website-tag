name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run has nothing left to prove, and its mutation matrix alone is
# twenty-five jobs. Cancel it rather than pay for it twice.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      mutation_filters: ${{ steps.mutation-scope.outputs.filters }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The mutation gate diffs against a base ref to find changed modules.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.50.0"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Resolve the mutation base
        id: mutation-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            printf 'ref=origin/%s\n' "${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=HEAD^\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the mutation scope
        id: mutation-scope
        run: |
          filters="$(uv run --locked python scripts/quality/mutation_scope.py \
            --base "${{ steps.mutation-base.outputs.ref }}" --json)"
          printf 'filters=%s\n' "$filters" >> "$GITHUB_OUTPUT"
          printf 'Mutation matrix: %s\n' "$filters"

      # The container gate lives in the Docker workflow, which runs beside this
      # one; building the image here too would pay for it twice per commit.
      - name: Run the tiered gate
        run: just qa-pr

  mutation:
    name: Mutation / ${{ matrix.shard.name }}
    needs: quality
    if: needs.quality.result == 'success' && needs.quality.outputs.mutation_filters != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Shards are now per-function groups, so there are more of them and
      # each is smaller; let more run at once or the fan-out buys nothing.
      max-parallel: 24
      matrix:
        shard: ${{ fromJSON(needs.quality.outputs.mutation_filters) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.50.0"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run scoped mutation gate
        env:
          MUTATION_FILTERS: ${{ matrix.shard.filters }}
        run: just mutation-module "$MUTATION_FILTERS"
